[package]
name = "yore"
version = "2.0.1"
authors = ["Andreas Liljeqvist <bonega@gmail.com>"]
edition = "2021"
categories = ["encoding"]
keywords = ["encoding", "charset"]
license = "MIT"
description = "Rust library for decoding/encoding character sets according to OEM code pages"
repository = "https://github.com/bonega/yore/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
# Enables `std::error::Error` impls for the error types. Implies `alloc`.
std = ["alloc"]
# Enables the allocating API (the `Cow`-returning `encode`/`decode` family),
# pulling in the `alloc` crate. Disable (`--no-default-features`) to build for
# `no_std` targets without an allocator; only the allocation-free char
# primitives (`encode_char`, `decode_byte`) remain available.
alloc = []

[dependencies]

[lib]
bench = false

[[bench]]
name = "benchmarks"
harness = false

[dev-dependencies]
criterion = "0.3.5"
rand = "0.8.4"
rand_pcg = "0.3.1"
