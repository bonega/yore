name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Build
        run: nix develop --command cargo build --verbose

      - name: Run tests
        run: nix develop --command cargo test --verbose

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      # Cross-compile to a bare-metal target that has no `std` at all, so a
      # `no_std` regression cannot slip through. The no-features build also has
      # no allocator, so it additionally guards the allocation-free primitives.
      - name: Build no_std + no_alloc (bare-metal target)
        run: nix develop --command cargo build --no-default-features --lib --target thumbv7em-none-eabi --verbose

      - name: Build no_std + alloc (bare-metal target)
        run: nix develop --command cargo build --no-default-features --features alloc --lib --target thumbv7em-none-eabi --verbose

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Fuzz validate target
        run: |
          cd fuzz
          nix develop --command cargo fuzz run validate -- -max_total_time=60

      - name: Fuzz invariant target
        run: |
          cd fuzz
          nix develop --command cargo fuzz run invariant -- -max_total_time=60

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Check formatting
        run: nix develop --command cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Run clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      # The `#[cfg(feature = "alloc")]` gating means an unused import in a
      # reduced feature set can only be caught by linting that set. Benches and
      # integration targets are not feature-gated, so these are lib-scoped.
      - name: Run clippy (no_std, no allocator)
        run: nix develop --command cargo clippy --no-default-features --lib -- -D warnings

      - name: Run clippy (no_std, alloc)
        run: nix develop --command cargo clippy --no-default-features --features alloc --lib -- -D warnings

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Run codegen
        run: |
          cd codegen
          nix develop .. --command cargo run

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "Error: Codegen produced changes that are not committed"
            echo "Please run 'cd codegen && cargo run' and commit the changes"
            git diff --stat
            exit 1
          fi

  # Final job that depends on all other jobs - use this in branch protection rules
  ci-success:
    runs-on: ubuntu-latest
    needs: [build-and-test, no-std, fuzz, codegen, format, clippy]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.build-and-test.result }}" != "success" || "${{ needs.no-std.result }}" != "success" || "${{ needs.fuzz.result }}" != "success" || "${{ needs.codegen.result }}" != "success" || "${{ needs.format.result }}" != "success" || "${{ needs.clippy.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
